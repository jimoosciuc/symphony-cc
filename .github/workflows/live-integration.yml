name: live-integration

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Live integration target to run"
        required: true
        default: all
        type: choice
        options:
          - all
          - github
          - graphql
          - claude
          - remote
          - full-e2e
          - role-github-e2e
          - remote-claude
          - concurrency-e2e
          - lanes-e2e
          - validation-matrix

jobs:
  live-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: make setup

      - name: Run live GitHub tracker tests
        if: ${{ inputs.target == 'all' || inputs.target == 'validation-matrix' || inputs.target == 'github' }}
        env:
          GITHUB_TOKEN: ${{ secrets.SYMPHONY_GITHUB_TOKEN || github.token }}
          SYMPHONY_GITHUB_TEST_OWNER: ${{ vars.SYMPHONY_GITHUB_TEST_OWNER }}
          SYMPHONY_GITHUB_TEST_REPO: ${{ vars.SYMPHONY_GITHUB_TEST_REPO }}
        run: make live-github

      - name: Run live GitHub GraphQL tool tests
        if: ${{ inputs.target == 'all' || inputs.target == 'validation-matrix' || inputs.target == 'graphql' }}
        env:
          GITHUB_TOKEN: ${{ secrets.SYMPHONY_GITHUB_TOKEN || github.token }}
        run: make live-graphql

      - name: Run live Claude provider tests
        if: ${{ inputs.target == 'all' || inputs.target == 'validation-matrix' || inputs.target == 'claude' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          SYMPHONY_CLAUDE_TEST_MODEL: ${{ vars.SYMPHONY_CLAUDE_TEST_MODEL }}
        run: make live-claude

      - name: Run live remote execution tests
        if: ${{ inputs.target == 'all' || inputs.target == 'validation-matrix' || inputs.target == 'remote' }}
        env:
          SYMPHONY_REMOTE_TEST_HOST: ${{ vars.SYMPHONY_REMOTE_TEST_HOST }}
          SYMPHONY_REMOTE_WORKSPACE_ROOT: ${{ vars.SYMPHONY_REMOTE_WORKSPACE_ROOT }}
          SYMPHONY_REMOTE_ARTIFACT_ROOT: ${{ vars.SYMPHONY_REMOTE_ARTIFACT_ROOT }}
          SYMPHONY_REMOTE_SESSION_STORE: ${{ vars.SYMPHONY_REMOTE_SESSION_STORE }}
          SYMPHONY_REMOTE_GIT_TOKEN: ${{ secrets.SYMPHONY_REMOTE_GIT_TOKEN }}
        run: make live-remote

      - name: Run full GitHub issue to Claude PR E2E
        if: ${{ inputs.target == 'all' || inputs.target == 'validation-matrix' || inputs.target == 'full-e2e' }}
        env:
          GITHUB_TOKEN: ${{ secrets.SYMPHONY_GITHUB_TOKEN || github.token }}
          SYMPHONY_GITHUB_TEST_OWNER: ${{ vars.SYMPHONY_GITHUB_TEST_OWNER }}
          SYMPHONY_GITHUB_TEST_REPO: ${{ vars.SYMPHONY_GITHUB_TEST_REPO }}
          SYMPHONY_E2E_TEST_ISSUE: ${{ vars.SYMPHONY_E2E_TEST_ISSUE }}
          SYMPHONY_CLAUDE_TEST_MODEL: ${{ vars.SYMPHONY_CLAUDE_TEST_MODEL }}
        run: make live-e2e

      - name: Run role workflow GitHub E2E
        if: ${{ github.event_name == 'schedule' || inputs.target == 'all' || inputs.target == 'validation-matrix' || inputs.target == 'role-github-e2e' }}
        env:
          GITHUB_TOKEN: ${{ secrets.SYMPHONY_GITHUB_TOKEN || github.token }}
          SYMPHONY_GITHUB_TEST_OWNER: ${{ vars.SYMPHONY_GITHUB_TEST_OWNER }}
          SYMPHONY_GITHUB_TEST_REPO: ${{ vars.SYMPHONY_GITHUB_TEST_REPO }}
        run: make live-role-github-e2e

      - name: Run remote Claude E2E
        if: ${{ inputs.target == 'all' || inputs.target == 'validation-matrix' || inputs.target == 'remote-claude' }}
        env:
          GITHUB_TOKEN: ${{ secrets.SYMPHONY_GITHUB_TOKEN || github.token }}
          SYMPHONY_GITHUB_TEST_OWNER: ${{ vars.SYMPHONY_GITHUB_TEST_OWNER }}
          SYMPHONY_GITHUB_TEST_REPO: ${{ vars.SYMPHONY_GITHUB_TEST_REPO }}
          SYMPHONY_REMOTE_CLAUDE_TEST_ISSUE: ${{ vars.SYMPHONY_REMOTE_CLAUDE_TEST_ISSUE }}
          SYMPHONY_CLAUDE_TEST_MODEL: ${{ vars.SYMPHONY_CLAUDE_TEST_MODEL }}
          SYMPHONY_REMOTE_TEST_HOST: ${{ vars.SYMPHONY_REMOTE_TEST_HOST }}
          SYMPHONY_REMOTE_WORKSPACE_ROOT: ${{ vars.SYMPHONY_REMOTE_WORKSPACE_ROOT }}
          SYMPHONY_REMOTE_ARTIFACT_ROOT: ${{ vars.SYMPHONY_REMOTE_ARTIFACT_ROOT }}
          SYMPHONY_REMOTE_SESSION_STORE: ${{ vars.SYMPHONY_REMOTE_SESSION_STORE }}
          SYMPHONY_REMOTE_GIT_TOKEN: ${{ secrets.SYMPHONY_REMOTE_GIT_TOKEN }}
        run: make live-remote-claude

      - name: Run multi-issue concurrency E2E
        if: ${{ inputs.target == 'all' || inputs.target == 'validation-matrix' || inputs.target == 'concurrency-e2e' }}
        env:
          GITHUB_TOKEN: ${{ secrets.SYMPHONY_GITHUB_TOKEN || github.token }}
          SYMPHONY_GITHUB_TEST_OWNER: ${{ vars.SYMPHONY_GITHUB_TEST_OWNER }}
          SYMPHONY_GITHUB_TEST_REPO: ${{ vars.SYMPHONY_GITHUB_TEST_REPO }}
          SYMPHONY_CONCURRENCY_E2E_ISSUES: ${{ vars.SYMPHONY_CONCURRENCY_E2E_ISSUES }}
          SYMPHONY_CONCURRENCY_E2E_PERMISSION_MODE: ${{ vars.SYMPHONY_CONCURRENCY_E2E_PERMISSION_MODE }}
          SYMPHONY_CLAUDE_TEST_MODEL: ${{ vars.SYMPHONY_CLAUDE_TEST_MODEL }}
        run: make live-concurrency-e2e

      - name: Run runtime lanes E2E
        if: ${{ inputs.target == 'all' || inputs.target == 'validation-matrix' || inputs.target == 'lanes-e2e' }}
        env:
          GITHUB_TOKEN: ${{ secrets.SYMPHONY_GITHUB_TOKEN || github.token }}
          SYMPHONY_GITHUB_TEST_OWNER: ${{ vars.SYMPHONY_GITHUB_TEST_OWNER }}
          SYMPHONY_GITHUB_TEST_REPO: ${{ vars.SYMPHONY_GITHUB_TEST_REPO }}
          SYMPHONY_LANES_E2E_ISSUES: ${{ vars.SYMPHONY_LANES_E2E_ISSUES }}
          SYMPHONY_LANES_E2E_PERMISSION_MODE: ${{ vars.SYMPHONY_LANES_E2E_PERMISSION_MODE }}
          SYMPHONY_LANES_E2E_REQUIRE_PR: ${{ vars.SYMPHONY_LANES_E2E_REQUIRE_PR }}
          SYMPHONY_CLAUDE_TEST_MODEL: ${{ vars.SYMPHONY_CLAUDE_TEST_MODEL }}
        run: make live-lanes-e2e
